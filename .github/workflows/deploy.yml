name: Deploy to raga.favha.cloud

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Push-triggered deploys only run when CI passed; manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/htdocs/raga.favha.cloud
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            git fetch origin main
            git reset --hard origin/main
            composer install --no-interaction --prefer-dist --optimize-autoloader
            npm ci
            npm run build
            php artisan migrate --force
            # Foto profil ditulis ke public/uploads/avatars (aplikasi sengaja
            # tidak memakai storage:link karena langkah itu tidak ada di deploy).
            mkdir -p public/uploads/avatars
            # Lengkapi username pengguna lama supaya profil publik /@username
            # dan halaman sosial berfungsi. Idempoten: pengguna yang sudah punya
            # username dilewati.
            php artisan users:backfill-usernames
            # CLI suuntool untuk jalur Suunto tidak resmi (read-only). Idempoten:
            # hanya diunduh bila belum ada, dan kegagalannya TIDAK menggagalkan
            # deploy (fitur tinggal menunjukkan pesan "binary belum terpasang").
            install_suuntool() {
              TARGET=""
              if [ -x "$HOME/.local/bin/suuntool" ]; then
                TARGET="$HOME/.local/bin/suuntool"
              elif command -v suuntool >/dev/null 2>&1; then
                TARGET="$(command -v suuntool)"
              else
                case "$(uname -m)" in
                  x86_64|amd64) ARCH=amd64 ;;
                  aarch64|arm64) ARCH=arm64 ;;
                  *) echo "suuntool: arch $(uname -m) belum didukung, dilewati"; return 0 ;;
                esac
                VERSION=0.10.0
                BASE="https://github.com/tajchert/suuntool/releases/download/v${VERSION}"
                mkdir -p "$HOME/.local/bin" /tmp/suuntool-dl
                curl -fsSL -o /tmp/suuntool-dl/suuntool.tar.gz "$BASE/suuntool_${VERSION}_linux_${ARCH}.tar.gz" || return 0
                curl -fsSL -o /tmp/suuntool-dl/checksums.txt "$BASE/checksums.txt" || return 0
                (cd /tmp/suuntool-dl && grep "suuntool_${VERSION}_linux_${ARCH}.tar.gz" checksums.txt | sha256sum -c - >/dev/null 2>&1) \
                  || { echo "suuntool: checksum tidak cocok, dilewati"; return 0; }
                tar -xzf /tmp/suuntool-dl/suuntool.tar.gz -C "$HOME/.local/bin" suuntool
                chmod 0755 "$HOME/.local/bin/suuntool"
                rm -rf /tmp/suuntool-dl
                TARGET="$HOME/.local/bin/suuntool"
              fi
              # Salinan app-local, SELALU disegarkan: PHP-FPM sering tidak punya
              # HOME di environment-nya sehingga ~/.local/bin tak terlihat.
              if [ -n "$TARGET" ] && [ -x "$TARGET" ]; then
                mkdir -p storage/app/bin
                cp "$TARGET" storage/app/bin/suuntool
                chmod 0755 storage/app/bin/suuntool
              fi
            }
            install_suuntool
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
